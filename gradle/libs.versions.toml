# Project-specific versions only.
#
# The build toolchain -- compileSdk/minSdk/targetSdk, jvmTarget, AGP, Kotlin, KSP,
# Dokka, nexus-publish -- comes from the shared catalog, imported as `conventions`
# in settings.gradle.kts.

[versions]

# https://github.com/JetBrains/compose-multiplatform
compose-multiplatform = "1.12.0"

# https://developer.android.com/jetpack/androidx/releases/activity
androidxActivity = "1.11.0"
# https://developer.android.com/jetpack/androidx/releases/appcompat
androidxAppCompat = "1.7.1"
coreKtx = "1.17.0"

datastore = "1.1.4"
kotlinxCoroutines = "1.10.1"

security-crypto = "1.1.0"
kotlinx-serialization = "1.5.1"

sha2 = "0.8.0"

[libraries]

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppCompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

androidx-security = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
datastore = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

kotlincrypto-hash-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "sha2" }

[plugins]

composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }


